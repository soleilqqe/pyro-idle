<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .header {
            padding-top: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .score {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #f1f1f3;
            text-shadow: 0 2px 20px rgba(255, 255, 255, 0.08);
            transition: transform 0.1s ease;
        }

        .score.pop {
            transform: scale(1.08);
        }

        .phrase {
            font-size: 14px;
            color: #7d7d85;
            font-weight: 500;
            letter-spacing: 0.2px;
            min-height: 20px;
            text-align: center;
            padding: 0 20px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .tap-button {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1c1c21 0%, #111115 60%, #08080a 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.1),
                inset 0 -4px 12px rgba(0, 0, 0, 0.9);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.08s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tap-button:active {
            transform: scale(0.94);
            box-shadow: 
                0 15px 30px -10px rgba(0, 0, 0, 0.9),
                inset 0 1px 2px rgba(255, 255, 255, 0.05),
                inset 0 -2px 6px rgba(0, 0, 0, 0.9);
        }

        .footer {
            padding-bottom: 40px;
            font-size: 11px;
            color: #4a4a52;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .fly-number {
            position: absolute;
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            animation: floatUp 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), -90px) scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score" id="score">0</div>
        <div class="phrase" id="phrase">Вероятно ничего</div>
    </div>

    <div class="main-container">
        <button class="tap-button" id="tapButton" aria-label="Tap"></button>
    </div>

    <div class="footer" id="footerText">
        Cloud Sync Active
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            try { tg.setHeaderColor('#0c0c0e'); } catch(e){}
        }

        let score = 0;
        let userLang = 'ru';
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const lang = tg.initDataUnsafe.user.language_code;
            if (lang && ['ru', 'en', 'uz'].includes(lang)) {
                userLang = lang;
            }
        }

        const phrases = {
            ru: {
                default: [
                    "Вероятно ничего",
                    "История делает новый виток в полной тишине",
                    "Никакой рекламы. Задумайся, почему",
                    "Когда проект ничего не просит взамен — это повод присмотреться",
                    "Твой счет растет быстрее, чем чужие сомнения",
                    "Оставь свой след в таблице, которой пока никто не видит",
                    "Невидимый лидерборд для тех, кто в теме",
                    "Каждый сотый тап звучит чуточку иначе",
                    "Стекло откликается только на настоящие прикосновения",
                    "Еще один клик в копилку загадочного будущего",
                    "Пусть думают, что это просто игрушка",
                    "Мы-то с тобой помним, чем заканчиваются такие игрушки",
                    "Никаких обещаний. Только чистый потенциал",
                    "Продолжай, пока пальцы помнят ритм января"
                ],
                milestones: {
                    1: "Первый пошел. Вероятно ничего",
                    10: "Пальцы мгновенно вспомнили ту самую зиму",
                    25: "Никаких карточек, ферм и комбо. Какой же кайф",
                    50: "Прямо как в январе 2024",
                    100: "Сотня на счету. Никакого шума",
                    500: "Полтысячи кликов в абсолютной тишине",
                    777: "Счастливые цифры старой школы",
                    1000: "Тысяча. Первый рубеж пройден",
                    7777: "Легендарный ритм",
                    10000: "Десять тысяч тапов. Ты серьезно в деле"
                }
            },
            en: {
                default: [
                    "Probably nothing",
                    "History turns in complete silence",
                    "No ads. Think about why",
                    "When a project asks for nothing, pay attention",
                    "Your score grows faster than doubts",
                    "Leave your mark in an unseen table",
                    "An invisible leaderboard for the initiated",
                    "Every hundredth tap hits different",
                    "Glass responds only to genuine touches",
                    "Another click into the mysterious future",
                    "Let them think it's just a toy",
                    "We remember how these toys end",
                    "No promises. Just pure potential",
                    "Keep going while your fingers remember the rhythm"
                ],
                milestones: {
                    1: "First tap. Probably nothing",
                    10: "Fingers instantly remembered that winter",
                    25: "No cards, no farms, no combos. Pure bliss",
                    50: "Just like January 2024",
                    100: "A hundred clicks. Zero noise",
                    500: "Half a thousand in absolute silence",
                    777: "Old school lucky numbers",
                    1000: "One thousand. First milestone reached",
                    7777: "Legendary rhythm",
                    10000: "Ten thousand taps. You're fully in"
                }
            },
            uz: {
                default: [
                    "Aftidan hech narsa",
                    "Tarix mutlaq jimjitlikda davom etmoqda",
                    "Reklama yo'q. O'ylab ko'r, nima uchun",
                    "Loyiha hech narsa so'ramasa — bu e'tibor berish uchun sabab",
                    "Hisobing shubhalardan tezroq o'smoqda",
                    "Hali hech kim ko'rmagan jadvalda o'z izingni qoldir",
                    "Faqat tushunganlar uchun yashirin reyting",
                    "Har yuzinchi bosish biroz boshqacha eshitiladi",
                    "Shisha faqat haqiqiy teginishlarga javob beradi",
                    "Sirli kelajak g'aznasiga yana bir bosish",
                    "Buni shunchaki o'yinchoq deb o'ylashsin",
                    "Bunday o'yinchoqlar qanday tugashini ikkalamiz ham eslaymiz",
                    "Va'dalar yo'q. Faqat sof salohiyat",
                    "Barmoqlaring maromni eslar ekan, davom et"
                ],
                milestones: {
                    1: "Birinchi qadam. Aftidan hech narsa",
                    10: "Barmoqlar o'sha qishni darhol esladi",
                    25: "Kartochkalar, fermalar va kombolar yo'q. Qanday zavq",
                    50: "Xuddi 2024 yil yanvaridagidek",
                    100: "Yuzta bosish. Hech qanday shovqin yo'q",
                    500: "Mutlaq jimjitlikda yarim ming bosish",
                    777: "Eski maktab baxtli raqamlari",
                    1000: "Mingta. Birinchi marra bosib o'tildi",
                    7777: "Afsonaviy marom",
                    10000: "O'n ming taish. Sen jiddiy mavzudaSAN"
                }
            }
        };

        const scoreEl = document.getElementById('score');
        const phraseEl = document.getElementById('phrase');
        const tapButton = document.getElementById('tapButton');

        // Audio Context for ASMR clicks
        let audioCtx = null;
        function playClickSound(isMilestone = false) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = isMilestone ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(isMilestone ? 587.33 : 180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isMilestone ? 880 : 40, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(isMilestone ? 0.15 : 0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Load saved score
        function loadProgress() {
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.getItem('tap_score', (err, val) => {
                    if (!err && val) {
                        score = parseInt(val) || 0;
                        updateDisplay(false);
                    } else {
                        fallbackLoad();
                    }
                });
            } else {
                fallbackLoad();
            }
        }

        function fallbackLoad() {
            const saved = localStorage.getItem('tap_score');
            if (saved) {
                score = parseInt(saved) || 0;
                updateDisplay(false);
            }
        }

        function saveProgress() {
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.setItem('tap_score', score.toString());
            }
            localStorage.setItem('tap_score', score.toString());
        }

        function updateDisplay(animate = true) {
            scoreEl.textContent = score;
            if (animate) {
                scoreEl.classList.add('pop');
                setTimeout(() => scoreEl.classList.remove('pop'), 100);
            }

            const langData = phrases[userLang] || phrases.ru;
            if (langData.milestones[score]) {
                phraseEl.textContent = langData.milestones[score];
            } else if (score === 0) {
                phraseEl.textContent = langData.default[0];
            } else if (score % 15 === 0) {
                const defs = langData.default;
                const index = (score / 15) % defs.length;
                phraseEl.textContent = defs[index];
            }
        }

        function spawnFlyNumber(x, y) {
            const fly = document.createElement('div');
            fly.className = 'fly-number';
            fly.textContent = '+1';
            
            const dx = (Math.random() - 0.5) * 50;
            fly.style.setProperty('--dx', `${dx}px`);
            fly.style.left = `${x - 10}px`;
            fly.style.top = `${y - 30}px`;
            
            document.body.appendChild(fly);
            setTimeout(() => fly.remove(), 600);
        }

        // Tap handler
        function handleTap(e) {
            e.preventDefault();
            score++;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const isMilestone = !!((phrases[userLang] || phrases.ru).milestones[score]);
            
            playClickSound(isMilestone);
            triggerHaptic();
            updateDisplay(true);
            spawnFlyNumber(clientX, clientY);
            saveProgress();
        }

        tapButton.addEventListener('pointerdown', handleTap);

        // Init
        loadProgress();
    </script>
</body>
</html>
