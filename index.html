<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pure Tap</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --coin-tilt-x: 0deg;
            --coin-tilt-y: 0deg;
            --coin-scale: 1;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08080a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            touch-action: none;
        }

        /* Fixed neutral dark ambient background - NEVER changes color */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 50% 56%, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 42%, transparent 72%);
        }

        .ambient-pulse {
            position: fixed;
            top: 56%;
            left: 50%;
            width: 340px;
            height: 340px;
            margin-left: -170px;
            margin-top: -170px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.09) 0%, transparent 70%);
            filter: blur(42px);
            opacity: 0.35;
            transform: scale(0.95);
            transition: transform 0.15s ease-out, opacity 0.2s ease-out;
            pointer-events: none;
            z-index: 0;
        }

        /* Minimalist Dark Glass Pill */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 10px 30px -10px rgba(0, 0, 0, 0.85),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
        }

        .liquid-glass-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
        }
        .liquid-glass-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Score Typography */
        .score-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            background: linear-gradient(180deg, #FFFFFF 15%, rgba(255, 255, 255, 0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
            transition: transform 0.09s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .score-bump {
            transform: scale(1.045);
        }

        /* 3D Coin Stage */
        .coin-stage {
            perspective: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Fixed Dark Matte & Liquid Glass Button */
        .liquid-coin {
            width: min(76vw, 310px);
            height: min(76vw, 310px);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transform: rotateX(var(--coin-tilt-x)) rotateY(var(--coin-tilt-y)) scale(var(--coin-scale));
            transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
            background: radial-gradient(circle at 32% 24%, #1c1c22 0%, #121216 42%, #0b0b0e 78%, #070709 100%);
            box-shadow:
                0 30px 65px -12px rgba(0, 0, 0, 0.96),
                0 0 38px -10px rgba(255, 255, 255, 0.05),
                inset 0 2px 3px rgba(255, 255, 255, 0.18),
                inset 0 -10px 24px rgba(0, 0, 0, 0.92);
            border: 1.5px solid rgba(255, 255, 255, 0.09);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Concentric Inner Recessed Ring */
        .coin-inner-ring {
            width: 82%;
            height: 82%;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle at 50% 38%, #151519 0%, #0a0a0d 76%, #060608 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                inset 0 8px 20px rgba(0, 0, 0, 0.9),
                inset 0 1px 1px rgba(255, 255, 255, 0.06),
                0 1px 2px rgba(255, 255, 255, 0.04);
        }

        /* Specular highlight gloss */
        .coin-gloss {
            position: absolute;
            top: 4%;
            left: 14%;
            width: 72%;
            height: 40%;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            filter: blur(1px);
        }

        /* Dynamic Shine Spot that moves with finger tilt */
        .coin-dynamic-glare {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 30%), rgba(255, 255, 255, 0.12) 0%, transparent 55%);
            pointer-events: none;
            opacity: 0.75;
        }

        /* Ripple Effect inside Coin */
        .tap-ripple {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 45%, transparent 70%);
            pointer-events: none;
            animation: rippleExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes rippleExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.1);
                opacity: 0.85;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.65);
                opacity: 0;
            }
        }

        /* Outer Shockwave Ring ( strictly neutral silver/white ) */
        .shockwave {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
            transform: translate(-50%, -50%) scale(0.8);
            animation: shockwaveAnim 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 5;
        }

        @keyframes shockwaveAnim {
            0% {
                transform: translate(-50%, -50%) scale(0.85);
                opacity: 0.7;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.36);
                opacity: 0;
            }
        }

        /* Floating +1 Number */
        .floating-plus {
            position: fixed;
            pointer-events: none;
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: -0.03em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
            z-index: 30;
            transform: translate(-50%, -50%);
            animation: floatUp 0.82s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate(-50%, -30%) scale(0.6);
            }
            18% {
                opacity: 1;
                transform: translate(-50%, -65%) scale(1.05);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--drift-x, 0px)), -165%) scale(0.92);
            }
        }

        /* Phrase Pill */
        .easter-pill {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease;
        }
        .easter-pill.highlight {
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.24);
        }
    </style>
</head>

        // --- 3. STATE, SHUFFLED PHRASE DECK & TELEGRAM CLOUD STORAGE ---
        const USER_STORAGE_KEY = `pure_tap_score_${tgUser && tgUser.id ? tgUser.id : 'guest'}`;

        let state = {
            score: 0,
            soundEnabled: true,
            lang: detectLang(),
            deck: [],
            deckPointer: 0,
            currentPhrase: ''
        };

        // Fisher-Yates shuffle so phrases never repeat until all 108 have been shown
        function buildShuffledDeck(lang) {
            const total = I18N[lang].ambient.length;
            const indices = Array.from({ length: total }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = indices[i];
                indices[i] = indices[j];
                indices[j] = temp;
            }
            state.deck = indices;
            state.deckPointer = 0;
        }

        function getNextUniquePhrase() {
            const list = I18N[state.lang].ambient;
            if (!state.deck || state.deck.length !== list.length || state.deckPointer >= state.deck.length) {
                buildShuffledDeck(state.lang);
            }
            let phraseIndex = state.deck[state.deckPointer];
            state.deckPointer += 1;

            if (list[phraseIndex] === state.currentPhrase && state.deckPointer < state.deck.length) {
                phraseIndex = state.deck[state.deckPointer];
                state.deckPointer += 1;
            }

            state.currentPhrase = list[phraseIndex];
            return state.currentPhrase;
        }

        const scoreDisplay = document.getElementById('scoreDisplay');
        const easterEggPill = document.getElementById('easterEggPill');
        const easterEggText = document.getElementById('easterEggText');

        const coinGlare = document.getElementById('coinGlare');
        const rippleContainer = document.getElementById('rippleContainer');
        const ambientPulse = document.getElementById('ambientPulse');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const iconSoundOn = document.getElementById('iconSoundOn');
        const iconSoundOff = document.getElementById('iconSoundOff');

        let saveDebounceTimer = null;

        function loadSavedProgress() {
            try {
                const localScore = parseInt(localStorage.getItem(USER_STORAGE_KEY) || '0', 10);
                if (!isNaN(localScore) && localScore > state.score) {
                    state.score = localScore;
                }
            } catch (e) {}

            updateUI();

            if (tg && tg.CloudStorage) {
                try {
                    tg.CloudStorage.getItems(['taps'], (err, values) => {
                        if (!err && values) {
                            const cloudTaps = parseInt(values.taps || '0', 10);
                            if (!isNaN(cloudTaps) && cloudTaps > state.score) {
                                state.score = cloudTaps;
                                try {
                                    localStorage.setItem(USER_STORAGE_KEY, String(state.score));
                                } catch (e) {}
                                updateUI();
                            }
                        }
                    });
                } catch (e) {}
            }
        }

        function saveProgress(immediate = false) {
            try {
                localStorage.setItem(USER_STORAGE_KEY, String(state.score));
            } catch (e) {}

            clearTimeout(saveDebounceTimer);
            const pushToCloud = () => {
                if (tg && tg.CloudStorage) {
                    try {
                        tg.CloudStorage.setItem('taps', String(state.score));
                    } catch (e) {}
                }
            };

            if (immediate) {
                pushToCloud();
            } else {
                saveDebounceTimer = setTimeout(pushToCloud, 350);
            }
        }

        window.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveProgress(true);
            }
        });

        // --- 4. WEB AUDIO API SOFT CLICK ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTapSound(isMilestone = false) {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const randomDetune = (Math.random() - 0.5) * 14;
            const baseFreq = 155 + randomDetune;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq * 1.5, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.045);

            gain.gain.setValueAtTime(0.26, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.055);

            const tickOsc = audioCtx.createOscillator();
            const tickGain = audioCtx.createGain();
            tickOsc.type = 'triangle';
            tickOsc.frequency.setValueAtTime(1120 + randomDetune * 2, now);
            tickOsc.frequency.exponentialRampToValueAtTime(340, now + 0.018);

            tickGain.gain.setValueAtTime(0.07, now);
            tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

            tickOsc.connect(tickGain);
            tickGain.connect(audioCtx.destination);
            tickOsc.start(now);
            tickOsc.stop(now + 0.022);

            if (isMilestone) {
                const chimeFreqs = [523.25, 659.25, 783.99];
                chimeFreqs.forEach((freq, idx) => {
                    const cOsc = audioCtx.createOscillator();
                    const cGain = audioCtx.createGain();
                    cOsc.type = 'sine';
                    const startTime = now + idx * 0.045;
                    cOsc.frequency.setValueAtTime(freq, startTime);

                    cGain.gain.setValueAtTime(0.001, startTime);
                    cGain.gain.linearRampToValueAtTime(0.08, startTime + 0.015);
                    cGain.gain.exponentialRampToValueAtTime(0.0008, startTime + 0.38);

                    cOsc.connect(cGain);
                    cGain.connect(audioCtx.destination);
                    cOsc.start(startTime);
                    cOsc.stop(startTime + 0.4);
                });
            }
        }

                    } else {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                    return;

            } catch (e) {}

            if (navigator.vibrate) {
                try {
                    navigator.vibrate(isMilestone ? [15, 30, 18] : 8);
                } catch (e) {}
            }
        }

        // --- 6. UI RENDERING ---
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function updateUI() {
            const dict = I18N[state.lang];
            scoreDisplay.textContent = formatNumber(state.score);

            if (state.soundEnabled) {
                iconSoundOn.classList.remove('hidden');
                iconSoundOff.classList.add('hidden');
            } else {
                iconSoundOn.classList.add('hidden');
                iconSoundOff.classList.remove('hidden');
            }

            const milestonePhrase = dict.milestones[state.score];
            if (milestonePhrase) {
                state.currentPhrase = milestonePhrase;
                easterEggText.textContent = milestonePhrase;
            } else if (state.score === 0) {
                state.currentPhrase = dict.defaultPhrase;
                easterEggText.textContent = dict.defaultPhrase;
            } else if (!state.currentPhrase) {
                easterEggText.textContent = getNextUniquePhrase();
            }
        }

        }

        let pulseTimer = null;
        function pulseAmbientLight() {
            ambientPulse.style.opacity = '0.65';
            ambientPulse.style.transform = 'scale(1.08)';
            clearTimeout(pulseTimer);
            pulseTimer = setTimeout(() => {
                ambientPulse.style.opacity = '0.35';
                ambientPulse.style.transform = 'scale(0.95)';
            }, 140);
        }

        let bumpTimer = null;
        function bumpScoreCounter() {
            scoreDisplay.classList.add('score-bump');
            clearTimeout(bumpTimer);
            bumpTimer = setTimeout(() => {
                scoreDisplay.classList.remove('score-bump');
            }, 90);
        }

        let resetTiltTimer = null;
        function applyCoinTilt(clientX, clientY) {
            const rect = coinButton.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const normX = Math.max(-1, Math.min(1, (clientX - centerX) / (rect.width / 2)));
            const normY = Math.max(-1, Math.min(1, (clientY - centerY) / (rect.height / 2)));

            const maxTilt = 15;
            const tiltX = -normY * maxTilt;
            const tiltY = normX * maxTilt;

            document.documentElement.style.setProperty('--coin-tilt-x', `${tiltX.toFixed(2)}deg`);
            document.documentElement.style.setProperty('--coin-tilt-y', `${tiltY.toFixed(2)}deg`);
            document.documentElement.style.setProperty('--coin-scale', '0.94');

            const glareX = 50 - normX * 28;
            const glareY = 35 - normY * 28;
            coinGlare.style.setProperty('--glare-x', `${glareX}%`);
            coinGlare.style.setProperty('--glare-y', `${glareY}%`);

            clearTimeout(resetTiltTimer);
            resetTiltTimer = setTimeout(resetCoinTilt, 150);
        }

        function resetCoinTilt() {
            document.documentElement.style.setProperty('--coin-tilt-x', '0deg');
            document.documentElement.style.setProperty('--coin-tilt-y', '0deg');
            document.documentElement.style.setProperty('--coin-scale', '1');
            coinGlare.style.setProperty('--glare-x', '50%');
            coinGlare.style.setProperty('--glare-y', '30%');
        }

        // --- 8. TAP HANDLER ---
        function handleTapAtPoint(clientX, clientY) {
            state.score += 1;

            const dict = I18N[state.lang];
            const milestonePhrase = dict.milestones[state.score];
            const isSpecialNumber = Boolean(milestonePhrase) || (state.score % 100 === 0);

            if (milestonePhrase) {
                showEasterEgg(milestonePhrase, true);
            } else if (state.score % 12 === 0) {
                showEasterEgg(getNextUniquePhrase(), state.score % 60 === 0);
            }

            const rect = coinButton.getBoundingClientRect();
            applyCoinTilt(clientX, clientY);
            spawnInnerRipple(clientX - rect.left, clientY - rect.top);
            spawnFloatingPlus(clientX, clientY);
            pulseAmbientLight();
            bumpScoreCounter();

            if (isSpecialNumber) {
                spawnOuterShockwave();
            }

            playTapSound(isSpecialNumber);
            triggerHaptic(isSpecialNumber);

            updateUI();
            saveProgress(false);
        }

        // --- 9. EVENT LISTENERS ---
        let lastTouchTime = 0;

        coinButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            lastTouchTime = Date.now();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTapAtPoint(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        coinButton.addEventListener('touchend', resetCoinTilt);

        coinButton.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch' || Date.now() - lastTouchTime < 500) return;
            handleTapAtPoint(e.clientX, e.clientY);
        });

        coinButton.addEventListener('pointerup', resetCoinTilt);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                const rect = coinButton.getBoundingClientRect();
                const rx = rect.left + rect.width * (0.35 + Math.random() * 0.3);
                const ry = rect.top + rect.height * (0.35 + Math.random() * 0.3);
                handleTapAtPoint(rx, ry);
            }
        });

        soundToggleBtn.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            if (state.soundEnabled) playTapSound(false);
            updateUI();
        });

        setInterval(() => {
            if (!easterEggPill.classList.contains('highlight') && state.score > 0) {
                showEasterEgg(getNextUniquePhrase(), false);
            }
        }, 9500);

        buildShuffledDeck(state.lang);
        loadSavedProgress();
    </script>
</body>
</html>
